packages:
  - 'packages/*'
  - 'frontend'
  - 'agents'

# Pin the proving toolchain across ALL workspaces to the versions nargo 1.0.0-beta.9 / bb 0.87.0
# emit. A newer @noir-lang/acvm_js cannot deserialize beta.9 ACIR, and bb proof formats differ
# across versions — see CLAUDE.md 'Toolchain / version pinning'.
overrides:
  '@noir-lang/noir_js': 1.0.0-beta.9
  '@aztec/bb.js': 0.87.0

# msgpackr-extract is an optional native accelerator (transitive dep); the pure-JS fallback is fine,
# so its build script is intentionally not run.
allowBuilds:
  msgpackr-extract: false

minimumReleaseAgeExclude:
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.199'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.199'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.199'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.199'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.199'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.199'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.199'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.199'
  - '@anthropic-ai/claude-agent-sdk@0.3.199'
