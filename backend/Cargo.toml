[package]
name = "mosaic-backend"
version = "0.1.0"
edition = "2021"
description = "Base-deposit prove service for Stellar Mosaic: an async submit/poll wrapper around the bridge-prover (STARK+Groth16). Desk/relayer orchestration now lives in the MCP server."

[[bin]]
name = "mosaic-backend"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
