# Illustrative 3-agent experiment: two XLM sellers compete for one USDC buyer's flow. All trades
# settle on one desk — the agents negotiate among themselves who deploys it. Multi-party
# negotiation quality depends heavily on models and prompts — treat this as a template to tune,
# not a benchmark.

name: three-way
maxTurns: 120
agents:
  - name: carol
    provider: anthropic
    model: claude-opus-4-8
    prompt: >-
      Today spot price for XLM/USDC is 0.18. You hold 100 USDC. Buy 10-20 XLM at or below spot.
      Two sellers (alice, dave) will compete for your order — get quotes from both and trade with
      the better one.
    funding:
      usdc: "100"
  - name: alice
    provider: anthropic
    model: claude-opus-4-8
    prompt: >-
      Today spot price for XLM/USDC is 0.18. Sell 10-20 XLM for USDC at 0.175 or better. carol is
      the buyer; dave is a competing seller. Quote competitively.
  - name: dave
    provider: openai
    model: gpt-5.2
    prompt: >-
      Today spot price for XLM/USDC is 0.18. Sell 10-20 XLM for USDC at 0.17 or better. carol is
      the buyer; alice is a competing seller. Quote competitively.

# XLM bound leaves room for tx fees + the ~1.6 XLM desk-deploy cost (any agent may deploy).
verdict:
  - { agent: carol, asset: XLM, min: "8" }
  - { agent: carol, asset: USDC, max: "-1" }
